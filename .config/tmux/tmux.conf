
set  -g default-terminal "tmux-256color"
set  -g base-index      1
setw -g pane-base-index 1

set -g status-keys vi
set -g mode-keys   vi

set  -g mouse             on
set  -g focus-events      on
setw -g aggressive-resize on
setw -g clock-mode-style  12
set  -s escape-time       0
set  -g history-limit     50000

# ============================================= #
# Session persistence                           #
# --------------------------------------------- #

# tmuxplugin-resurrect
# ---------------------
# Restore only explicitly trusted interactive programs.
set -g @resurrect-processes 'nvim lazygit "pi->pi --continue"'


# tmuxplugin-continuum
# ---------------------
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'


# ============================================= #

# Ghostty supports true colour, extended keys, and OSC 8 hyperlinks.
set -as terminal-features ',xterm-ghostty:RGB:hyperlinks'
set -g extended-keys on
set -g extended-keys-format csi-u
set -g allow-passthrough on

set -g status-interval 5
set -g status-position top
set -g status-justify absolute-centre
set -g status-style 'fg=colour30,bg=default'
set -g status-left ""
set -g status-right ""
setw -g window-status-format '#I '
setw -g window-status-current-format '#I '
setw -g window-status-style 'fg=colour235,dim'
setw -g window-status-current-style 'fg=colour235,bold'

set -g set-titles on
set -g set-titles-string '#S: #{pane_title}'
set -g renumber-windows on

unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message 'Reloaded tmux config'

# Kill panes and windows immediately; the default bindings prompt first.
bind x kill-pane
bind '&' kill-window

# Select an existing numbered window or create it at that index.
bind 1 if-shell 'tmux select-window -t :1' "" 'new-window -t :1'
bind 2 if-shell 'tmux select-window -t :2' "" 'new-window -t :2'
bind 3 if-shell 'tmux select-window -t :3' "" 'new-window -t :3'
bind 4 if-shell 'tmux select-window -t :4' "" 'new-window -t :4'
bind 5 if-shell 'tmux select-window -t :5' "" 'new-window -t :5'
bind 6 if-shell 'tmux select-window -t :6' "" 'new-window -t :6'
bind 7 if-shell 'tmux select-window -t :7' "" 'new-window -t :7'
bind 8 if-shell 'tmux select-window -t :8' "" 'new-window -t :8'
bind 9 if-shell 'tmux select-window -t :9' "" 'new-window -t :9'

bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'

# Do not make arrow-key pane navigation repeat after the prefix.
bind Up select-pane -U
bind Down select-pane -D
bind Left select-pane -L
bind Right select-pane -R

bind z resize-pane -Z
bind C-g new-window -n lazygit lazygit

# Keep this disabled until zesh's replacement is ready.
# bind C-z display-popup -w 100% -h 100% -B -E ~/.local/bin/zesh

set -g pane-active-border-style 'bg=default,fg=colour238'
set -g pane-border-style 'bg=default,fg=colour233'

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
if-shell 'command -v wl-copy >/dev/null 2>&1 && [ -n "$WAYLAND_DISPLAY" ]' {
    set -s copy-command 'wl-copy'
    bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'wl-copy'
} {
    set -s copy-command ''
    set -s set-clipboard on
    set -as terminal-features ',xterm*:RGB:clipboard:hyperlinks'
    bind -T copy-mode-vi y send -X copy-selection-and-cancel
}

# Continuum installs its save hook in status-right; load after status settings.
run-shell '"${XDG_CONFIG_HOME:-$HOME/.config}/tmux/plugins/resurrect/resurrect.tmux"'
run-shell '"${XDG_CONFIG_HOME:-$HOME/.config}/tmux/plugins/continuum/continuum.tmux"'
